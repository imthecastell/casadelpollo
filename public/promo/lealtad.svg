<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-label="Tarjeta de lealtad de Casa del Pollo">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D8321F"/>
      <stop offset="1" stop-color="#8F1A10"/>
    </linearGradient>
    <linearGradient id="tarjeta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FBF1E4"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#2A0A06" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="900" fill="url(#fondo)"/>
  <circle cx="1040" cy="150" r="260" fill="#F0A020" opacity=".16"/>
  <circle cx="130" cy="780" r="300" fill="#FFFFFF" opacity=".07"/>
  <circle cx="1100" cy="760" r="120" fill="#FFFFFF" opacity=".08"/>

  <g transform="rotate(-5 600 450)" filter="url(#sombra)">
    <rect x="230" y="190" width="740" height="470" rx="46" fill="url(#tarjeta)"/>
    <rect x="230" y="190" width="740" height="104" rx="46" fill="#C62A1B"/>
    <rect x="230" y="248" width="740" height="46" fill="#C62A1B"/>
    <text x="276" y="258" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="40" font-weight="800" fill="#FFFFFF">Casa del Pollo</text>
    <text x="924" y="258" text-anchor="end" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" opacity=".9">LEALTAD</text>

    <text x="276" y="362" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#7B5850">TUS VISITAS</text>
    <g>
      <circle cx="312" cy="428" r="27" fill="#F0A020"/>
      <circle cx="388" cy="428" r="27" fill="#F0A020"/>
      <circle cx="464" cy="428" r="27" fill="none" stroke="#E4D3BF" stroke-width="5"/>
      <circle cx="540" cy="428" r="27" fill="none" stroke="#E4D3BF" stroke-width="5"/>
      <circle cx="616" cy="428" r="27" fill="none" stroke="#E4D3BF" stroke-width="5"/>
      <circle cx="692" cy="428" r="27" fill="none" stroke="#E4D3BF" stroke-width="5"/>
      <circle cx="768" cy="428" r="27" fill="none" stroke="#E4D3BF" stroke-width="5"/>
      <circle cx="844" cy="428" r="27" fill="none" stroke="#E4D3BF" stroke-width="5"/>
      <circle cx="920" cy="428" r="27" fill="none" stroke="#E4D3BF" stroke-width="5"/>
    </g>
    <text x="276" y="520" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="27" font-weight="700" fill="#2A0F0B">Empiezas con 2 visitas de regalo</text>

    <rect x="276" y="552" width="190" height="72" rx="36" fill="#2A7A4B"/>
    <text x="371" y="602" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">10%</text>
    <rect x="490" y="552" width="190" height="72" rx="36" fill="#C62A1B"/>
    <text x="585" y="602" text-anchor="middle" font-family="'Plus Jakarta Sans', 'Segoe UI', Arial, sans-serif" font-size="38" font-weight="800" fill="#FFFFFF">15%</text>
    <text x="712" y="598" font-family="'DM Sans', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="600" fill="#7B5850">de descuento</text>
  </g>
</svg>
